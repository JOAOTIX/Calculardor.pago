<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Azul para el Reloj -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <!-- Gradiente Verde para la Moneda -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Fondo de la App (Opcional, estilo tarjeta) -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Botón superior del cronómetro -->
  <rect x="37" y="14" width="16" height="6" rx="2" fill="url(#blueGrad)" />
  <rect x="42" y="10" width="6" height="4" rx="1" fill="url(#blueGrad)" />

  <!-- Cuerpo del Reloj -->
  <circle cx="45" cy="47" r="22" fill="none" stroke="url(#blueGrad)" stroke-width="7" />
  
  <!-- Manecillas -->
  <path d="M45 32 V47 L55 57" fill="none" stroke="url(#blueGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="45" cy="47" r="4" fill="url(#blueGrad)" />
  
  <!-- Moneda superpuesta -->
  <circle cx="70" cy="70" r="17" fill="url(#greenGrad)" stroke="#F8FAFC" stroke-width="4" />
  
  <!-- Texto de la moneda -->
  <text x="70" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">S/</text>
</svg>
